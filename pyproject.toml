[project]
name = "python-template"
version = "0.0.0"
description = "A template for a Python application"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyrefly]
preset = "all"
project-includes = ["src", "tests"]
